name: ${PROJECT_NAME:-kronos}

services:
  # ==========================================
  # ENTORNO DE DESARROLLO (Vite + HMR)
  # Uso: docker compose --profile development up
  # ==========================================
  web-dev:
    profiles: ["development"]
    image: node:20-alpine
    container_name: ${PROJECT_NAME:-kronos}-dev
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    working_dir: /app
    ports:
      - "${PORT_WEB_DEV:-5173}:5173"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true 
    volumes:
      - ./:/app
      - /app/node_modules 
    networks:
      - local_network

  # ==========================================
  # ENTORNO DE PRODUCCIÓN (Build + Nginx)
  # Uso: docker compose --profile production up
  # ==========================================
  web-prod:
    profiles: ["production"]
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile 
      args:
        - VITE_APP_DOMAIN=${VITE_APP_DOMAIN:-http://localhost}
    image: ${PROJECT_NAME:-kronos}-prod-image
    container_name: ${PROJECT_NAME:-kronos}-prod
    restart: unless-stopped
    ports:
      - "${PORT_WEB_PROD:-80}:80"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - local_network
      - public_network 

networks:
  local_network:
    driver: bridge
  public_network:
    external: true 