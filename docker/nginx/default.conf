server {
    listen 80;
    server_name localhost;

    # 1. Logs heredados de tu configuración
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 2. Compresión GZIP (Esencial para cargar rápido el JS de React)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # 3. Raíz del proyecto
    root /usr/share/nginx/html;
    index index.html;

    # 4. Seguridad: Bloqueo de archivos sensibles (Rescatado de tu config)
    location ~ /\.(ht|env|git|DS_Store) {
        deny all;
    }

    # 5. Enrutamiento SPA 
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 6. Caché optimizada para Vite
    location ~* ^/assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Caché para imágenes y tipografías en la raíz pública
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    }
}